version: '3.8'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 app:app
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - private_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api1:
    build: .
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - private_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api2:
    build: .
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - .:/app
    networks:
      - private_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api1
      - api2
      - grafana
      - prometheus
    networks:
      - public_network
      - private_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - private_network

  grafana:
    image: grafana/grafana
    environment:
      - GF_SERVER_DOMAIN=mercyreact.duckdns.org
      - GF_SERVER_ROOT_URL=https://mercyreact.duckdns.org/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    networks:
      - private_network

networks:
  public_network:
  private_network:
