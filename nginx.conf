events {}

http {
    # Balanceador de carga hacia 2 copias de FastAPI
    upstream fastapi_backend {
        server api1:8000;
        server api2:8000;
    }

    server {
        listen 80;

        # Redirigir el tráfico de la API a FastAPI
        location /api {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }

        # Redirigir el resto del tráfico web a Flask
        location / {
            proxy_pass http://web:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs;
        }
    }
}
